<style>
/* Layout: sticky header + product grid; detail view swaps in per color with size tables */
:root{
  --bg:#F3F3F0; --surface:#FFFFFF; --sunk:#E8E8E3; --fg:#1B1D21; --muted:#5F636B; --line:#D9D9D2;
  --accent:#2C4A6E; --accent-ink:#FFFFFF;
  --ok:#2F7A4F; --ok-bg:#E3F1E8; --warn:#9A6A00; --warn-bg:#FBF0D4; --crit:#B4401F; --crit-bg:#FBE4DC; --out:#6B6B6B; --out-bg:#E7E7E4;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131518; --surface:#1C1F23; --sunk:#25292E; --fg:#ECEDEE; --muted:#9BA0A8; --line:#30353B;
  --accent:#8FB3DE; --accent-ink:#0F1A27;
  --ok:#6FCF97; --ok-bg:#1B3226; --warn:#E8B949; --warn-bg:#3A2F12; --crit:#F08A6C; --crit-bg:#3D2018; --out:#A9A9A9; --out-bg:#2A2C2F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131518; --surface:#1C1F23; --sunk:#25292E; --fg:#ECEDEE; --muted:#9BA0A8; --line:#30353B;
  --accent:#8FB3DE; --accent-ink:#0F1A27;
  --ok:#6FCF97; --ok-bg:#1B3226; --warn:#E8B949; --warn-bg:#3A2F12; --crit:#F08A6C; --crit-bg:#3D2018; --out:#A9A9A9; --out-bg:#2A2C2F;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
html,body{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;margin:0}
.brand span{color:var(--muted);font-size:13px}
.search{flex:1 1 220px;max-width:340px;position:relative}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.meta{font-size:12.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.summary{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 14px;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:12px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.totals{margin-left:auto;font-size:13px;color:var(--muted)}
.totals strong{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--muted)}
.ph{aspect-ratio:4/5;width:100%;max-width:100%;background:var(--sunk);position:relative;overflow:hidden;display:block}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.stripes{position:absolute;inset:0;display:flex}
.stripes i{flex:1}
.ph .nophoto{position:absolute;left:10px;bottom:10px;font-size:11px;background:var(--surface);color:var(--muted);padding:3px 8px;border-radius:999px}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.code{font-family:var(--f-mono);font-size:15px;font-weight:500;letter-spacing:.01em}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.type{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1}
.big small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted);margin-left:4px}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.dot i,.sw{width:12px;height:12px;border-radius:50%;border:1px solid var(--line);display:inline-block;flex:none}
.pill{font-size:11px;font-weight:600;letter-spacing:.05em;padding:3px 8px;border-radius:999px;white-space:nowrap}
.s-YETERLİ{color:var(--ok);background:var(--ok-bg)}
.s-DÜŞÜK{color:var(--warn);background:var(--warn-bg)}
.s-KRİTİK{color:var(--crit);background:var(--crit-bg)}
.s-TÜKENDİ{color:var(--out);background:var(--out-bg)}
.empty{padding:48px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
/* detail */
.back{margin:18px 0 10px}
.dhead{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:start;margin-bottom:28px}
.dhead .ph{border-radius:var(--r);border:1px solid var(--line)}
.dinfo{display:flex;flex-direction:column;gap:14px;min-width:0}
.dinfo h2{font-family:var(--f-mono);font-weight:500;font-size:clamp(24px,4vw,34px);margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi span{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:120px minmax(0,1fr)}
.ccard .ph{aspect-ratio:auto;height:100%;min-height:170px}
.cbody{padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cname{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
.seri{font-size:12.5px;color:var(--muted)}
.seri b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:6px;text-align:right;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
td.k{font-weight:600;font-size:15px}
.tbl{overflow-x:auto}
.upl{font-size:12px;padding:5px 10px}
.phbtn{position:absolute;right:8px;bottom:8px;white-space:nowrap}
.ccard .nophoto{display:none}
.note{font-size:12.5px;color:var(--muted)}
/* update panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-family:var(--f-display);font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:640px){
  .dhead{grid-template-columns:1fr}
  .dhead .ph{max-width:340px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .big{font-size:22px}
  .colors{grid-template-columns:1fr}
  .ccard{grid-template-columns:1fr}
  .ccard .ph{min-height:0;height:auto;aspect-ratio:4/3}
  .totals{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
/* ---- CRM additions ---- */
body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.vhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:20px 0 12px}
.vhead h2{font-family:var(--f-display);font-size:24px;margin:0;text-wrap:balance}
.vhead .meta{margin-left:auto}
.list{display:flex;flex-direction:column;gap:8px}
.lrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;text-align:left;width:100%;cursor:pointer}
button.lrow:hover{border-color:var(--muted)}
.lrow .t1{font-weight:600;font-size:15.5px;min-width:0}
.lrow .t2{font-size:12.5px;color:var(--muted);min-width:0}
.lrow .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.lrow .r small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1;margin-top:4px}
.tag{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.crit{background:var(--crit-bg);color:var(--crit)}.tag.ok{background:var(--ok-bg);color:var(--ok)}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.sec{margin:26px 0 10px;font-family:var(--f-display);font-size:18px}
.lock{max-width:340px;margin:40px auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.lock h2{font-family:var(--f-display);margin:0;font-size:22px}
.pin{font-family:var(--f-mono);font-size:30px;letter-spacing:.5em;text-align:center;width:200px;padding:10px 0 10px .5em;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.err{color:var(--crit);font-size:13.5px;min-height:1.2em}
.mini{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.thumb{width:44px;height:55px;border-radius:6px;overflow:hidden;background:var(--sunk);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.who{display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.who a,.linkish{color:var(--accent);text-decoration:none;cursor:pointer;background:none;border:0;padding:0;font:inherit;text-align:left}
.who .wl{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.who .wl:last-child{border-bottom:0}
.pf{background:#fff;color:#1B1D21;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-top:6px}
.pf h3{font-family:var(--f-display);margin:0 0 2px;font-size:20px}
.pf .meta2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px;font-size:13px;margin:14px 0}
.pf .meta2 span{display:block;color:#5F636B;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.pf table td,.pf table th{border-color:#D9D9D2;color:#1B1D21}
.pf th{color:#5F636B}
.pft td{vertical-align:top;line-height:1.35}.pft .sub{font-size:11.5px;color:#5F636B;white-space:normal}
.pft td:first-child{min-width:96px}
.pf .tot{margin-left:auto;max-width:320px;font-size:14px;margin-top:12px}
.pf .tot div{display:flex;justify-content:space-between;padding:3px 0}
.pf .tot .g{font-weight:700;border-top:1px solid #1B1D21;margin-top:4px;padding-top:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
@media print{
  header.top,.tabbar,.actions,.back,.noprint{display:none!important}
  body{background:#fff;padding:0}.pf{border:0;padding:0}
}
</style>
</head><body><header class="top"><div class="top-in">
  <div class="brand"><h1>SUWEY</h1><span id="brandSub">Stok</span></div>
  <div class="search" id="searchBox"><input id="q" type="search" placeholder="Ürün kodu veya renk ara" aria-label="Ara"></div>
  <div class="meta" id="meta">Yükleniyor…</div>
</div></header>

<main class="wrap" id="view"></main>

<nav class="tabbar" aria-label="Bölümler"><div class="tabbar-in">
  <button class="tab" data-tab="stok"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>Stok</button>
  <button class="tab" data-tab="musteri"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.8c2 .7 3.2 2.4 3.6 5.2"/></svg>Müşteriler</button>
  <button class="tab" data-tab="sevk"><svg viewBox="0 0 24 24"><path d="M2 6h12v10H2z"/><path d="M14 9h4l4 4v3h-8"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>Sevk</button>
  <button class="tab" data-tab="tahsilat"><svg viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 10h19"/><path d="M6.5 15h4"/></svg>Tahsilat</button>
  <button class="tab" data-tab="fiyat"><svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>Fiyatlar</button>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script>
const COLORS={"SİYAH":"#1E1E20","GRİ":"#9A9DA3","EKRU":"#EEE7D7","KAHVE":"#6B4A35","CAMEL":"#C29A6A","BEJ":"#D8C6A6","MAVİ":"#4D72A8","BEYAZ":"#FAFAF7","LACİVERT":"#22324F","YEŞİL":"#4F7A5A","KIRMIZI":"#A8322D","PEMBE":"#E3A6B4","BORDO":"#6E1F2B","HAKİ":"#7A7550","VİZON":"#A89480","ANTRASİT":"#3E4146","FÜME":"#5B5E63","KREM":"#F1E6CC","TABA":"#9C5B32","SARI":"#E2B93B","TURUNCU":"#D9762F","MOR":"#6A4A8A","İNDİGO":"#2E3F78"};
const RANK={"TÜKENDİ":0,"KRİTİK":1,"DÜŞÜK":2,"YETERLİ":3};
const S={stock:null,photos:{},filter:"all",q:"",canEdit:false,db:null,assets:null,pending:null,target:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>new Intl.NumberFormat("tr-TR").format(n);
function swatch(c){if(COLORS[c])return COLORS[c];let h=0;for(const ch of c)h=(h*31+ch.charCodeAt(0))%360;return `hsl(${h} 25% 55%)`}
const TR={"İ":"I","I":"I","ı":"i","Ş":"S","ş":"s","Ğ":"G","ğ":"g","Ü":"U","ü":"u","Ö":"O","ö":"o","Ç":"C","ç":"c"};
function slug(s){return String(s).trim().replace(/[İIıŞşĞğÜüÖöÇç]/g,c=>TR[c]).replace(/\s+/g,"_").replace(/[^A-Za-z0-9_\-.~:@+]/g,"-")}
const pkey=(p,c)=>slug(p)+"__"+(c?slug(c):"KAPAK");
const purl=(p,c)=>{const d=S.photos[pkey(p,c)];return d&&d.path?d.path:null};
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}
function worst(list){return list.reduce((a,b)=>RANK[b]<RANK[a]?b:a,"YETERLİ")}
function statusOf(k){const st=S.stock;if(k<=0)return"TÜKENDİ";if(k<=st.kritik)return"KRİTİK";if(k<=st.dusuk)return"DÜŞÜK";return"YETERLİ"}

function products(){
  const m=new Map();
  for(const r of S.stock.rows){
    if(!m.has(r.p))m.set(r.p,{p:r.p,t:r.t,colors:new Map()});
    const P=m.get(r.p);if(!P.colors.has(r.c))P.colors.set(r.c,[]);P.colors.get(r.c).push(r);
  }
  return [...m.values()].map(P=>{
    const colors=[...P.colors.entries()].map(([c,sizes])=>{
      sizes.sort((a,b)=>String(a.s).localeCompare(String(b.s),"tr",{numeric:true}));
      const k=sizes.reduce((a,r)=>a+Math.max(0,r.k),0);
      return {c,sizes,k,seri:Math.min(...sizes.map(r=>Math.max(0,r.k))),status:worst(sizes.map(r=>r.d||statusOf(r.k)))};
    });
    const all=colors.flatMap(x=>x.sizes);
    return {...P,colors,k:colors.reduce((a,x)=>a+x.k,0),g:all.reduce((a,r)=>a+r.g,0),sat:all.reduce((a,r)=>a+r.sat,0),bek:all.reduce((a,r)=>a+r.bek,0),status:worst(colors.map(x=>x.status))};
  }).sort((a,b)=>a.p.localeCompare(b.p,"tr",{numeric:true}));
}

function photoBox(p,c,colorsForStripes,label){
  const u=c===undefined?(purl(p)||colorsForStripes.map(x=>purl(p,x)).find(Boolean)):purl(p,c);
  if(u)return `<img src="${u}" alt="${esc(label)}" loading="lazy">`;
  const st=(colorsForStripes||[c]).map(x=>`<i style="background:${swatch(x)}"></i>`).join("");
  return `<div class="stripes">${st}</div><span class="nophoto">Fotoğraf yok</span>`;
}
function uploadBtn(p,c,txt){return S.assets?`<button class="btn upl phbtn" data-up="${esc(p)}" data-uc="${esc(c||"")}">${txt}</button>`:""}

/* ---------- state ---------- */
S.crm=null;S.enc=null;S.tab="stok";
const money=(n,d=0)=>new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",minimumFractionDigits:d,maximumFractionDigits:d}).format(n||0);
const dt=s=>s?new Date(s+"T12:00:00").toLocaleDateString("tr-TR",{day:"numeric",month:"short",year:"numeric"}):"—";
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const daysAgo=s=>s?Math.round((today()-new Date(s+"T00:00:00"))/864e5):null;
const ago=s=>{const n=daysAgo(s);return n==null?"":n<=0?"bugün":n===1?"dün":n+" gün önce"};
const ascii=s=>String(s).replace(/[İIıŞşĞğÜüÖöÇç]/g,c=>TR[c]).toUpperCase().replace(/[^A-Z]/g,"");
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(_){return null}}

/* ---------- crypto ---------- */
async function decrypt(enc,pin){
  const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(enc.salt),iterations:enc.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(enc.iv)},key,b(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(pin,silent){
  if(!S.enc)return false;
  try{S.crm=derive(await decrypt(S.enc,pin));ls("suwey-pin",pin);return true}
  catch(_){if(silent)ls("suwey-pin",null);return false}
}

/* ---------- derived CRM model ---------- */
function derive(raw){
  const L=raw.lineCols.reduce((o,c,i)=>(o[c]=i,o),{});
  const who={};
  const customers=raw.customers.map((cu,ci)=>{
    const orders=cu.orders.map((o,oi)=>{
      const ls_=o.lines.map(l=>({p:l[L.p],c:l[L.c],s:l[L.s],adet:l[L.adet],liste:l[L.liste],isk:l[L.isk],net:l[L.net],tutar:l[L.tutar],teslim:l[L.teslim],sevkT:l[L.sevkT],fatura:l[L.fatura],odeme:l[L.odeme]}));
      const sum=f=>ls_.reduce((a,l)=>a+(f(l)||0),0);
      const pend=ls_.filter(l=>l.teslim!=="TESLİM EDİLDİ");
      const st=pend.length===0?"Teslim edildi":pend.length===ls_.length?"Sevk bekliyor":"Kısmi sevk";
      for(const l of ls_){const k=l.p+"|"+l.c;(who[k]=who[k]||{});const w=who[k][ci]=who[k][ci]||{ci,adet:0,last:""};w.adet+=l.adet;if((o.d||"")>w.last)w.last=o.d||""}
      return {oi,d:o.d,lines:ls_,adet:sum(l=>l.adet),tutar:sum(l=>l.tutar),brut:sum(l=>l.liste*l.adet),pendAdet:pend.reduce((a,l)=>a+l.adet,0),pendLines:pend,status:st,
        sevkT:ls_.map(l=>l.sevkT).filter(Boolean).sort().pop()||null,fatura:sum(l=>l.fatura),
        tahsil:sum(l=>l.odeme==="TAHSİL EDİLDİ"?l.fatura:0),acik:sum(l=>l.odeme==="BEKLİYOR"?l.fatura:0)};
    });
    const s=f=>orders.reduce((a,o)=>a+f(o),0);
    return {ci,n:cu.n,city:cu.city,orders,adet:s(o=>o.adet),tutar:s(o=>o.tutar),fatura:s(o=>o.fatura),tahsil:s(o=>o.tahsil),acik:s(o=>o.acik),pendAdet:s(o=>o.pendAdet),last:orders[0]?orders[0].d:null};
  });
  return {...raw,customers,who};
}

/* ---------- routing ---------- */
const PH={stok:"Ürün kodu veya renk ara",musteri:"Müşteri veya şehir ara",sevk:"Müşteri, şehir veya ürün ara",tahsilat:"Müşteri veya şehir ara",fiyat:"Ürün kodu ara"};
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  let tab="stok";
  if(h.startsWith("u-")){tab="stok";viewProduct(h.slice(2))}
  else if(h.startsWith("m-")){tab="musteri";viewCustomer(+h.slice(2))}
  else if(h.startsWith("pf-")){tab="musteri";const[a,b]=h.slice(3).split("-");viewProforma(+a,+b)}
  else if(h==="musteri"){tab="musteri";viewCustomers()}
  else if(h==="sevk"){tab="sevk";viewSevk()}
  else if(h==="tahsilat"){tab="tahsilat";viewTahsilat()}
  else if(h==="fiyat"){tab="fiyat";viewFiyat()}
  else viewStock();
  if(tab!==S.tab){S.tab=tab;S.q="";$("q").value=""}
  $("q").placeholder=PH[tab];
  $("searchBox").hidden=/^(u|m|pf)-/.test(h);
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  const pf=$("pinForm");if(pf)pf.onsubmit=e=>{e.preventDefault();submitPin()};const pb=$("pinBtn");if(pb)pb.onclick=submitPin;
  const lb=$("lockBtn");if(lb)lb.onclick=()=>{S.crm=null;ls("suwey-pin",null);route()};
}
function renderMeta(){
  const st=S.stock;if(!st){$("meta").textContent="";return}
  $("meta").textContent="Rapor tarihi: "+(st.reportDate?new Date(st.reportDate+"T12:00:00").toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"}):"");
}
function render(){renderMeta();route()}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-f],[data-back],[data-tab]");if(!t)return;
  if(t.dataset.tab){location.hash=t.dataset.tab==="stok"?"":t.dataset.tab;if(t.dataset.tab==="stok")route();scrollTo(0,0);return}
  if(t.dataset.go){location.hash=t.dataset.go;return}
  if(t.dataset.f){S.filter=t.dataset.f;viewStock();return}
  if(t.dataset.back!==undefined){history.length>1?history.back():(location.hash="");return}
});
window.addEventListener("hashchange",()=>{route();scrollTo(0,0)});
let qT;$("q").addEventListener("input",e=>{S.q=e.target.value;clearTimeout(qT);qT=setTimeout(route,120)});

/* ---------- boot ---------- */
render();
fetch("data.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{S.stock=d.stock;S.photos=d.photos||{};render()})
  .catch(()=>{if(!S.stock)$("view").innerHTML='<div class="empty" style="margin-top:20px">Stok verisi yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.</div>'});
fetch("crm.enc",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(async enc=>{S.enc=enc;const p=ls("suwey-pin");if(p)await unlock(p,true);route()}).catch(()=>{});
</script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body></html>
